
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>File Upload</title>
</head>
<body>

<h2>Upload a File</h2>

<form action="upload" method="POST" enctype="multipart/form-data">

    <label>Select a file:</label>
    <input type="file" name="file" required>

    <br><br>

    <button type="submit">Upload</button>

</form>

</body>
</html>
